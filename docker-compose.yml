
services:
  pocketsearch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pocketsearch
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DB_PATH=/app/data/webscope.db
      - KNOWLEDGE_CACHE_DB=/app/data/knowledge_cache.db
      - TIMEOUT=8
      - MAX_BODY_BYTES=5242880
      - RECON_CACHE_HOURS=24
      - HISTORY_DAYS=30
      - VACUUM_INTERVAL_HOURS=1
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
