{% extends "base.html" %}

{% block content %}
<div class="markdown-container">
  <div class="markdown-content">
    {{ content | safe }}
  </div>
</div>
<style>
.markdown-container {
  max-width: 900px;
  margin: 2rem auto;
  padding: 2rem;
  background: #1a1a1a;
  border-radius: 4px;
  color: #e0e0e0;
  font-family: "IBM Plex Mono", monospace;
  line-height: 1.6;
}
.markdown-content {
  white-space: pre-wrap;
  word-wrap: break-word;
  font-size: 13px;
}
.markdown-content a {
  color: #4a9eff;
  text-decoration: none;
}
.markdown-content a:hover {
  text-decoration: underline;
}
</style>
{% endblock %}
