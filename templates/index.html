{% extends "base.html" %}
{% block title %}KitPocket Recon{% endblock %}

{% block content %}
<style>
  body {
    overflow: hidden;
    background: #000000 !important;
  }

  .footer, main { display: none !important; }
  .navbar { display: none !important; }

  .pass-home {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: #000000;
  }

  .pass-status-bar {
    position: absolute;
    top: 0;
    width: 100%;
    height: 32px;
    background: #000000;
    border-bottom: 1px solid #222222;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #666666;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .status-item { display: flex; gap: 6px; }
  .status-label { color: #666666; }
  .status-value { color: #999999; font-weight: 600; }

  .pass-shell {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 0 40px;
  }

  .pass-logo-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .pass-logo {
    font-size: 28px;
    color: #666666;
  }

  .pass-logo-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: #888888;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .pass-search-section {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .pass-search .search-box {
    width: 100%;
    height: 44px;
    border: 1px solid #333333;
    background: transparent;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    border-radius: 4px;
  }

  .search-box-icon {
    color: #666666;
    font-size: 18px;
  }

  .pass-search .search-box-input {
    flex: 1;
    border: none;
    background: transparent;
    color: #ffffff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    outline: none;
  }

  .pass-search .search-box-input::placeholder {
    color: #555555;
  }

  .search-box-button {
    background: #ffffff;
    color: #000000;
    border: none;
    padding: 8px 20px;
    border-radius: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .search-box-button:hover {
    background: #e0e0e0;
  }

  .pass-modes {
    display: flex !important;
    gap: 12px;
    justify-content: center;
  }

  .pass-modes button {
    padding: 6px 14px;
    border: 1px solid #444444;
    background: transparent;
    color: #888888;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .pass-modes button:hover {
    border-color: #666666;
    color: #aaaaaa;
  }

  .pass-modes button.active {
    color: #ffffff;
    border-color: #ffffff;
  }

  .pass-mode-hint {
    display: block !important;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #666666;
  }

  .pass-popover { display: none !important; }
  .pass-tools-button { display: none !important; }

  @media (max-width: 700px) {
    .pass-shell { gap: 32px; padding: 0 20px; }
    .pass-logo-section { gap: 12px; }
    .pass-logo { font-size: 24px; }
    .pass-logo-label { font-size: 12px; }
    .pass-search .search-box { height: 40px; }
    .pass-search .search-box-input { font-size: 12px; }
  }
</style>

<section class="pass-home" aria-label="Search">
  <div class="pass-status-bar">
    <div class="status-item">
      <span class="status-label">●</span>
      <span class="status-label">BACKEND</span>
      <span class="status-value">CONNECTED</span>
    </div>
    <div class="status-item">
      <span class="status-label">SEARCHES</span>
      <span class="status-value">0</span>
    </div>
    <div class="status-item">
      <span class="status-label">SAVED</span>
      <span class="status-value">0</span>
    </div>
    <div class="status-item">
      <span class="status-label">ENTITIES</span>
      <span class="status-value">0</span>
    </div>
  </div>

  <div class="pass-shell">
    <div class="pass-logo-section">
      <div class="pass-logo">⚙️</div>
      <div class="pass-logo-label">KITPOCKET RECON</div>
    </div>

    <form
      action="{{ url_for('go') }}"
      method="post"
      id="heroSearchForm"
      autocomplete="off"
    >
      <div class="pass-search-section">
        <div class="pass-search">
          <div class="search-box">
            <span class="search-box-icon">🔍</span>
            <input
              type="text"
              name="query"
              id="heroSearchInput"
              class="search-box-input"
              placeholder="Search"
              aria-label="Search query"
              autofocus
              required
            >
            <button type="submit" class="search-box-button">Search</button>
            <input type="hidden" name="mode" id="modeInput" value="auto">
          </div>
        </div>

        <div class="pass-modes">
          <button type="button" class="mode-btn active" data-mode="auto">AUTO</button>
          <button type="button" class="mode-btn" data-mode="domain">DOMAIN</button>
          <button type="button" class="mode-btn" data-mode="person">PERSON</button>
          <button type="button" class="mode-btn" data-mode="code">CODE</button>
        </div>

        <div class="pass-mode-hint">Auto-detects domain, person, or code query</div>
      </div>
    </form>
  </div>
</section>

<script>
(function () {
  const form = document.getElementById('heroSearchForm');
  const input = document.getElementById('heroSearchInput');

  window.addEventListener('load', () => {
    input.focus();
  });

  form.addEventListener('submit', () => {
    const submitBtn = form.querySelector('.search-box-button');
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Searching...';
    }
    if (input) {
      input.disabled = true;
    }
  });

  document.addEventListener('keydown', event => {
    if (
      (event.ctrlKey || event.metaKey) &&
      event.key.toLowerCase() === 'k'
    ) {
      event.preventDefault();
      input.focus();
    }
  });
})();
</script>
{% endblock %}

<script>
(function () {
  const form = document.getElementById('heroSearchForm');
  const input = document.getElementById('heroSearchInput');
  const modeInput = document.getElementById('modeInput');
  const modeBtns = document.querySelectorAll('.mode-btn');

  modeBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      modeBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      modeInput.value = btn.dataset.mode;
    });
  });

  window.addEventListener('load', () => {
    input.focus();
  });

  form.addEventListener('submit', () => {
    const submitBtn = form.querySelector('.search-box-button');
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Searching...';
    }
    if (input) {
      input.disabled = true;
    }
  });

  document.addEventListener('keydown', event => {
    if (
      (event.ctrlKey || event.metaKey) &&
      event.key.toLowerCase() === 'k'
    ) {
      event.preventDefault();
      input.focus();
    }
  });
})();
</script>
